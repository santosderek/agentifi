[workspace]
resolver = "2"
members = [
  "apps/agentifi-server",
  "apps/agentifi-desktop",
  "crates/domain",
  "crates/application",
  "crates/ports",
  "crates/adapters",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Derek Santos"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = [
  "apps/agentifi-server",
  "apps/agentifi-desktop",
  "crates/domain",
  "crates/application",
  "crates/ports",
  "crates/adapters",
  # Vendored Fleet client SDK. Kept under fleet/sdk/ rather than crates/ so that code Agentifi
  # OWNS stays visibly separate from code Agentifi MIRRORS from another repository. See
  # fleet/sdk/PROVENANCE.md for the source commit and the re-vendor procedure.
  "fleet/sdk/fleet-protocol",
  "fleet/sdk/fleet-enrollment",
  "fleet/sdk/fleet-client",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Derek Santos"]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
eframe = "0.31"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

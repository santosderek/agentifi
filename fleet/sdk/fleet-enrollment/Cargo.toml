[package]
name = "fleet-enrollment"
version = "0.1.0"
# VENDORED COPY -- see fleet/sdk/PROVENANCE.md before editing.
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Vendored Fleet enrollment types, device signing, and signed envelopes."
publish = false

[dependencies]
fleet-protocol = { path = "../fleet-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.9"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
